name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: meta
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          elif git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}$"; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Skip notice
        if: steps.meta.outputs.exists == 'true'
        run: echo "Tag ${{ steps.meta.outputs.tag }} already exists — skipping release."

      - name: Package plugin
        if: steps.meta.outputs.exists == 'false'
        run: npm run package

      - name: Create release
        if: steps.meta.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Code Enhance ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/code-enhance-${{ steps.meta.outputs.version }}.zip
            dist/code-enhance.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
